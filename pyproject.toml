[project]
name = "vim-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["anthropic", "requests"]

[project.optional-dependencies]
dev = ["pytest"]
postgres = ["psycopg[binary]"]
images = ["pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
